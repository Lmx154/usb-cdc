[package]
name = "usb-cdc-hil"
description = "On-target programs of the usb-cdc crate. Run with tools/run.sh alive, usb_cdc_smoke, usb_cdc_fullpacket, usb_cdc_link or usb_cdc_unplug; tools/usb_smoke.sh drives them with the host program."
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "hil_common"

[dependencies]
usb-cdc = { path = "..", features = ["defmt"] }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xb", "binary-info"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
critical-section = "1.1"
embassy-sync = "0.8.0"
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt"] }
embedded-io-async = "0.7"
embassy-futures = "0.1.2"
static_cell = "2.1.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
semihosting = "0.1"

[profile.release]
debug = true

[workspace]
